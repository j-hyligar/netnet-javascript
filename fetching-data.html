<!DOCTYPE html>
<html lang="en-US">
<script src="js/min.js"></script>
  <head>
    <title>netnet Fetching Data Demo</title>
    <meta name="jayden h" content="jayden h">
    <meta name="viewport" content="width=device-width, initial-scale=1">
  </head>
  <body>

  <script>
    /* global nn */

    async function setup () {
      // fetch data from the "Dog CEO" REST API

      // i chose to fetch poms because they're very cute ! 
      // but as a fun fact, we have a boston terrier-pug !
      // his name is cocoa :)

      const url = 'https://dog.ceo/api/breed/pomeranian/images/random'
      const res = await fetch(url)
      const data = await res.json()
      // press F12 to open console (fn + F12 on mac)
      console.log(data)
      // create an <img> and add it to the pag
      nn.create('img') 
        .set('src', data.message)
        .css('width', 900)
        .addTo('body')
    }

    nn.on('load', setup)
    nn.on('click', setup)

  </script>

  </body>
</html>
