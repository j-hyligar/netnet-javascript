<link rel="stylesheet" href="css/styles.css">
<script src="js/nn.min.js"></script>
<script>
  /* global nn */

  function tenPrint() {
    const hue = nn.random(60)
    const light = nn.random(60) + 10
    const clr = nn.hsl(hue, 100, light)
    const chars = ' ⮀ ⮁ ⮂ ⮃ ⮄ ⮅ ⮆ ⮇'
    let pattern = ''
    nn.times(1260, () => pattern += nn.random(chars))
    nn.get('body')
      .content(pattern)
      .css('background', clr)
  }

  nn.on('load', tenPrint)
  nn.on('click', tenPrint)
</script>
